<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Route planner</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Read-only info banner -->
  <div id="readonly-banner" class="readonly-banner" style="display:none;"></div>

  <!-- Hamburger button -->
  <button id="hamburger-btn" class="hamburger-btn" type="button">
    <span></span><span></span><span></span>
  </button>

  <!-- Sidebar overlay (mobile) -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2 id="sidebar-title"></h2>
      <button id="sidebar-close-btn" class="sidebar-close-btn" type="button">&times;</button>
    </div>

    <div class="sidebar-body">
      <div class="address-search-wrap">
        <input id="address-input" type="text" class="address-input" autocomplete="off" />
        <div id="address-suggestions" class="address-suggestions"></div>
      </div>

      <button id="import-gpx-btn" type="button" class="sidebar-action-btn"></button>
      <input id="import-gpx-input" type="file" accept=".gpx" multiple hidden />

      <button id="merge-routes-btn" type="button" class="sidebar-action-btn" style="display:none;"></button>
      <button id="download-gpx-btn" type="button" class="sidebar-action-btn" style="display:none;"></button>
      <button id="clear-all-btn" type="button" class="sidebar-action-btn sidebar-action-btn--danger"></button>

      <div class="sidebar-contact-section">
        <h4 id="contact-title">Contact</h4>
        <a href="https://www.instagram.com/kaffe_racer" target="_blank" rel="noopener noreferrer" class="sidebar-ig-link">
          <svg width="16" height="16" viewBox="0 0 24 24" style="vertical-align:-3px;margin-right:4px;">
            <defs>
              <linearGradient id="ig-gradient-sidebar" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#FED576"/>
                <stop offset="26%" stop-color="#F47133"/>
                <stop offset="61%" stop-color="#BC3081"/>
                <stop offset="100%" stop-color="#4C63D2"/>
              </linearGradient>
            </defs>
            <path fill="url(#ig-gradient-sidebar)" d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 2 .3 2.4.5.6.2 1 .5 1.5 1 .4.4.7.9 1 1.5.2.4.4 1.2.5 2.4.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.3 2-.5 2.4-.3.6-.6 1-1 1.5-.4.4-.9.7-1.5 1-.4.2-1.2.4-2.4.5-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-2-.3-2.4-.5-.6-.3-1-.6-1.5-1-.4-.4-.7-.9-1-1.5-.2-.4-.4-1.2-.5-2.4C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c.1-1.2.3-2 .5-2.4.3-.6.6-1 1-1.5.4-.4.9-.7 1.5-1 .4-.2 1.2-.4 2.4-.5C8.4 2.2 8.8 2.2 12 2.2zm0 1.8c-3.1 0-3.5 0-4.7.1-1 .1-1.6.2-1.9.4-.5.2-.8.4-1.1.7-.3.3-.6.7-.7 1.1-.1.3-.3.9-.4 1.9-.1 1.2-.1 1.6-.1 4.7s0 3.5.1 4.7c.1 1 .2 1.6.4 1.9.2.5.4.8.7 1.1.3.3.7.6 1.1.7.3.1.9.3 1.9.4 1.2.1 1.6.1 4.7.1s3.5 0 4.7-.1c1-.1 1.6-.2 1.9-.4.5-.2.8-.4 1.1-.7.3-.3.6-.7.7-1.1.1-.3.3-.9.4-1.9.1-1.2.1-1.6.1-4.7s0-3.5-.1-4.7c-.1-1-.2-1.6-.4-1.9-.2-.5-.4-.8-.7-1.1-.3-.3-.7-.6-1.1-.7-.3-.1-.9-.3-1.9-.4-1.2-.1-1.6-.1-4.7-.1zm0 3.5a4.5 4.5 0 110 9 4.5 4.5 0 010-9zm0 1.8a2.7 2.7 0 100 5.4 2.7 2.7 0 000-5.4zm5.7-2a1.05 1.05 0 11-2.1 0 1.05 1.05 0 012.1 0z"/>
          </svg>
          @kaffe_racer
        </a>
      </div>
    </div>
  </aside>

  <!-- Map -->
  <div id="map" class="map"></div>

  <!-- Bottom sheet / info widget -->
  <div id="info-widget" class="info-widget">
    <h3 id="bottom-sheet-header" class="bottom-sheet-header">
      <span id="route-list-title"></span>
      <span class="total-distance-inline">
        <span id="total-distance-label"></span>: <span id="total-distance-value">0 km</span>
      </span>
    </h3>
    <div id="route-list-container" class="route-list-container"></div>
  </div>

  <!-- Confirm delete modal -->
  <div id="confirm-delete-modal" class="modal-overlay">
    <div class="modal-box">
      <h3 id="confirm-delete-title"></h3>
      <p id="confirm-delete-body"></p>
      <div class="modal-actions">
        <button id="confirm-no-btn" type="button" class="modal-btn modal-btn--secondary"></button>
        <button id="confirm-yes-btn" type="button" class="modal-btn modal-btn--danger"></button>
      </div>
    </div>
  </div>

  <!-- Route name modal -->
  <div id="route-name-modal" class="modal-overlay">
    <div class="modal-box">
      <h3 id="route-name-modal-title"></h3>
      <input id="route-name-input" type="text" class="modal-input" />
      <div class="modal-actions">
        <button id="route-name-cancel-btn" type="button" class="modal-btn modal-btn--secondary"></button>
        <button id="route-name-save-btn" type="button" class="modal-btn modal-btn--primary"></button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
